server {
    listen 80 default_server;
    server_name schoje.online www.schoje.online _;
    root /var/www/teste;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /estatico/ { expires 30d; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location / { try_files $uri $uri/ =404; }
    gzip on; gzip_types text/css application/javascript image/svg+xml;
}
